<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1e1e1e; color: #d4d4d4; font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif; min-height: 100vh; }
  button { font-family: inherit; }
  .hidden { display: none !important; }

  .top { display: flex; justify-content: space-between; align-items: center; padding: 14px 24px; background: #252526; border-bottom: 1px solid #333; flex-wrap: wrap; gap: 12px; }
  .top h1 { font-size: 18px; color: #fff; display: flex; align-items: center; gap: 8px; }
  .ver { color: #4ec9b0; font-family: Consolas, monospace; font-size: 14px; }
  .title-chip { font-size: 12px; background: #3a3d41; color: #d7ba7d; padding: 2px 8px; border-radius: 10px; font-weight: 500; }
  .stats { display: flex; gap: 24px; flex-wrap: wrap; }
  .stat-label { font-size: 11px; color: #888; }
  .stat-val { font-size: 19px; font-weight: 600; color: #fff; font-family: Consolas, monospace; }
  .stat-val.rate { color: #b5cea8; }
  .stat-val.key { color: #d7ba7d; }
  .stat-val.rep { color: #c586c0; }

  .goalbar { display: flex; align-items: center; gap: 12px; padding: 8px 24px; background: #1b2b3a; border-bottom: 1px solid #333; font-size: 13px; flex-wrap: wrap; }
  .goal-label { background: #007acc; color: #fff; font-size: 11px; padding: 2px 8px; border-radius: 3px; font-weight: 600; }
  #goal { color: #e0e0e0; }
  #buffs { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #2d4a2d; color: #b5cea8; }
  .chip.bad { background: #4a2d2d; color: #f48771; }

  .main { display: grid; grid-template-columns: 1fr 400px; gap: 16px; padding: 16px 24px; }
  .panel { background: #252526; border: 1px solid #333; border-radius: 6px; overflow: hidden; position: relative; }

  .tab { background: #2d2d2d; padding: 6px 14px; font-size: 13px; color: #ccc; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
  .tab .lines { color: #888; margin-left: 10px; font-size: 12px; }
  .tab .right { display: flex; align-items: center; gap: 10px; }
  .tab .stage-name { color: #888; }
  .btn { font-size: 12px; background: #0e639c; color: #fff; border: none; border-radius: 3px; padding: 4px 10px; cursor: pointer; }
  .btn:disabled, .btn.off { background: #3c3c3c; color: #777; cursor: default; }
  .btn.warn { background: #8a4b08; }
  .btn.gray { background: #3c3c3c; color: #ccc; border: 1px solid #555; }

  .status { display: flex; align-items: center; gap: 16px; padding: 6px 14px; font-size: 12px; color: #aaa; border-bottom: 1px solid #333; background: #232323; flex-wrap: wrap; min-height: 32px; }
  .status .debt { display: flex; align-items: center; gap: 6px; }
  .mini-bar { width: 90px; height: 6px; background: #333; border-radius: 3px; overflow: hidden; }
  .mini-fill { height: 100%; background: #6a9955; }
  .bug-count { color: #f48771; font-weight: 600; }
  .incident { color: #f48771; font-weight: 600; animation: pulse 1s infinite; }
  @keyframes pulse { 50% { opacity: .5; } }

  .challenge { padding: 8px 14px; background: #3a2f12; border-bottom: 1px solid #5a4a1a; font-size: 13px; display: flex; align-items: center; gap: 14px; }
  .challenge .word { font-family: Consolas, monospace; font-size: 18px; letter-spacing: 2px; }
  .challenge .typed { color: #4ec9b0; }
  .challenge .rest { color: #888; }
  .challenge .meta { color: #d7ba7d; margin-left: auto; }

  .code { font-family: Consolas, "D2Coding", monospace; font-size: 14px; line-height: 1.6; padding: 10px 0; height: 440px; overflow-y: auto; overflow-x: auto; cursor: text; }
  .code::-webkit-scrollbar { width: 10px; height: 10px; }
  .code::-webkit-scrollbar-thumb { background: #424242; }
  .code.refactoring { opacity: .5; }
  .ln { display: flex; white-space: pre; min-height: 22px; }
  .ln .no { width: 60px; flex-shrink: 0; text-align: right; padding-right: 18px; color: #6e7681; user-select: none; }
  .ln.bug { background: rgba(244, 71, 71, .22); cursor: pointer; }
  .ln.bug .no { color: #f48771; }
  .ln.bug .tx::after { content: "  클릭해서 수정"; color: #f48771; font-family: "Malgun Gothic", sans-serif; font-size: 11px; opacity: .8; }

const $ = id => document.getElementById(id);

function ri(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
const KR_UNITS = ['', '만', '억', '조', '경', '해', '자', '양', '구', '간', '정', '재', '극', '항하사', '아승기', '나유타', '불가사의', '무량대수'];
// 1만 이상은 한국식 단위(만, 억, 조...)로 표시
function fmt(n) {
  if (typeof n !== 'number' || !isFinite(n)) return '0';
  if (n < 100) return n.toFixed(1);
  if (n < 1e4) return Math.floor(n).toLocaleString();
  const k = Math.floor(Math.log10(n) / 4);
  if (k >= KR_UNITS.length) {
    const e = Math.floor(Math.log10(n));
    return (n / Math.pow(10, e)).toFixed(2) + 'e' + e;
  }
  const v = n / Math.pow(10, 4 * k);
  return (v < 10 ? v.toFixed(2) : v < 100 ? v.toFixed(1) : Math.floor(v).toString()) + KR_UNITS[k];
}
function won(n) { return fmt(n) + '원'; }
function fmtInt(n) { return Math.floor(n).toLocaleString(); }
function fmtSec(s) { return Math.max(0, Math.ceil(s)) + '초'; }
function lower(s) { return s.charAt(0).toLowerCase() + s.slice(1); }
function suffix(n, len) { const r = Math.floor(n / len); return r > 0 ? String(r + 1) : ''; }
function countOf(lv, i, len) { return lv > i ? Math.floor((lv - 1 - i) / len) + 1 : 0; }

/* =========================================================
 * 수치 공식
 * ========================================================= */
function achCount() { return Object.keys(state.career.ach).length; }
function buffMult(kind) {
  let m = 1;
  for (const b of state.buffs) if (b.kind === kind && b.until > state.time) m *= b.mult;
  return m;
}
function hasBuff(kind) { return state.buffs.some(b => b.kind === kind && b.until > state.time); }
function addBuff(kind, mult, sec, label, bad) { state.buffs.push({ kind, mult, until: state.time + sec, label, bad: !!bad }); }
function salaryRate() {
  let s = 0;
  for (const r of ROLES) s += state.team[r.id] * r.salary;
  return s * Math.pow(0.7, SK().lead);
}
function bugPenalty() { return Math.min(0.85, 0.6 + 0.05 * state.lv.log); }
function offlineEff() { return Math.min(1, 0.5 + 0.1 * state.lv.srv); }
function debtFactor() { return 1 / (1 + 0.25 * state.lv.review) * Math.pow(0.75, SK().clean) / (1 + 0.2 * state.team.senior); }
function bugChance() { return 0.004 * (1 + state.debt / 25) / (1 + 0.3 * state.lv.test) * Math.pow(0.75, SK().cicd); }
function refactorDuration() { return Math.max(1.5, 8 / (1 + 0.25 * state.lv.cls) * Math.pow(0.7, SK().cicd) / (1 + 0.5 * state.team.senior)); }
function incidentTime() { return 30 + 5 * state.lv.log; }
function questSlots() { return 1 + state.team.pm; }
function questRewardMult() { return (1 + 0.5 * SK().nego) * (1 + 0.25 * state.team.pm); }
function careerMult() { return (1 + 0.5 * Math.min(state.career.level, 5)) * (state.career.founded ? 10 : 1); }
function repMult() { return 1 + state.rep * 0.03 * (1 + 0.5 * SK().network); }

function upgradeMult() {
  const L = state.lv;
  return (1 + L.var) * Math.pow(1 + L.func, 1.5) * (1 + L.cls) * Math.pow(2, L.srv);
}
function rate() {
  let r = upgradeMult() * state.releaseMult * repMult() * Math.pow(2, SK().sql) * careerMult() * (1 + 0.03 * achCount());
  r *= Math.max(0.1, 1 - salaryRate());
  r *= 1 - state.debt / 200;
  r *= Math.pow(bugPenalty(), state.bugs.length);
  if (state.refactoring) r *= 0.5;
  if (state.lv.cls > 0 && state.time < state.cleanUntil) r *= 1 + 0.3 * state.lv.cls;
  return r * buffMult('income');
}
function keyGain() {
  if (state.refactoring) return 0;
  return (1 + rate() * KEY_GAIN_RATIO) * (1 + state.lv.key) * Math.pow(2, SK().typist) * buffMult('typing');
}
function cost(u) { return u.base * Math.pow(u.growth, state.lv[u.id]); }
function releaseGain() {
  if (state.runBest < RELEASE_MIN) return 0;
  return Math.pow(state.runBest / 1e5, 0.3);
}
function currentStage() {
  let s = 0;
  for (let i = 0; i < STAGES.length; i++) if (state.runBest >= STAGES[i].at) s = i;
  return s;
}
function addValue(v) {
  if (!(v > 0)) return;
  state.value += v;
  S().earned += v;
  if (state.value > state.runBest) state.runBest = state.value;
}
function addDebt(v) { state.debt = Math.min(100, Math.max(0, state.debt + v)); }
function addRep(v) { state.rep = Math.max(0, state.rep + v); }

function upgDesc(u) {
  const l = state.lv[u.id];
  switch (u.id) {
    case 'var':    return '수입 x' + fmt(1 + l);
    case 'key':    return '타이핑 수익 x' + fmt(1 + l);
    case 'func':   return '수입 x' + fmt(Math.pow(1 + l, 1.5));
    case 'test':   return '버그 확률 ' + Math.round(100 / (1 + 0.3 * l)) + '%로 감소';
    case 'cls':    return '수입 x' + fmt(1 + l) + ', 리팩토링 ' + refactorDuration().toFixed(1) + '초, 정리 후 30초간 수입 x' + (1 + 0.3 * l).toFixed(1);
    case 'review': return '코드 복잡도 증가 ' + Math.round(100 / (1 + 0.25 * l)) + '%로 감소';
    case 'log':    return '장애 대응 ' + incidentTime() + '초, 버그 1개당 수입 x' + bugPenalty().toFixed(2);
    case 'srv':    return '수입 x' + fmt(Math.pow(2, l)) + ', 트래픽 대응, 오프라인 수익 ' + Math.round(offlineEff() * 100) + '%';
  }
  return '';
}

/* =========================================================
 * 코드 생성
 * ========================================================= */
function codeFor(id, lv) {
  const stage = state.stage;
  const n = lv - 1;
  const noun = NOUNS[n % NOUNS.length] + suffix(n, NOUNS.length);
  const low = lower(noun);
  if (id === 'var') {
    const v = VARS[n % VARS.length];
    return [v[0] + ' ' + v[1] + suffix(n, VARS.length) + ' = ' + v[2] + ';'];
  }
  if (id === 'func') {
    if (stage >= 4) return ['', '@GetMapping("/' + low + '")', 'public ' + noun + 'Vo get' + noun + '() {', '    return ' + low + 'Service.find();', '}'];
    if (stage >= 3) return ['', 'public ' + noun + 'Vo get' + noun + '() {', '    return ' + low + 'Dao.select();', '}'];
    return ['', 'public Object get' + noun + '() {', '    return db.find("' + low + '");', '}'];
  }
  if (id === 'cls') {
    const head = stage >= 2 ? ['', '@Getter', 'public class ' + noun + 'Vo {'] : ['', 'public class ' + noun + 'Vo {'];
    return head.concat(['    private Long id;', '    private String name;', '}']);
  }
  if (id === 'test') return ['', '@Test', 'void test' + noun + 'Find() {', '    assertNotNull(' + low + 'Service.find(1));', '}'];
  if (id === 'key') return ['// 기계식 키보드 Lv.' + lv + ' 장착 (' + ['청축', '갈축', '적축', '흑축', '저소음 적축'][n % 5] + ')'];
  if (id === 'review') return ['// [코드리뷰] ' + REVIEWS[n % REVIEWS.length] + ' 반영 완료'];
  if (id === 'log') return ['log.info("[' + noun + '] 처리 시작");'];
  if (id === 'srv') {
    if (stage >= 5) return ['router.route("/svc' + lv + '", ' + Math.pow(2, lv) + ');'];
    return ['server.scale(' + Math.pow(2, lv) + ');  // 서버 ' + lv + '대'];
  }
  return [];
}

function enqueue(lines, target) {
  const ind = state.refactorCount > 0 ? I : '';
  state[target || 'pending'] += lines.map(l => l ? ind + l : '').join('\n') + '\n';
}

/* =========================================================
 * 구매
 * ========================================================= */
function buy(id) {
  const u = UPGRADES.find(x => x.id === id);
  if (!u || state.runBest < u.unlock) return;
  if (hasBuff('freeze')) { toast('코드 프리징 기간에는 업그레이드를 살 수 없습니다'); return; }
  let bought = 0;
  let hidden = 0;
  do {
    const c = cost(u);
    if (!isFinite(c) || state.value < c) break;
    state.value -= c;
    state.lv[u.id]++;
    bought++;
    if (bought <= MAX_TYPED_PER_BUY) enqueue(codeFor(u.id, state.lv[u.id]));
    else hidden++;
  } while (buyMax && bought < 1000);
  if (hidden > 0) enqueue(['// ... ' + u.name + ' ' + hidden + '건 더 추가']);
  if (bought > 0) {
    S().upgrades += bought;
    addDebt(0.8 * Math.min(bought, 10) * debtFactor());
  }
}

/* =========================================================
 * 리팩토링

function today() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function sectionHeader(title) {
  const bar = '='.repeat(50);
  return [I + '/* ' + bar, I + ' * ' + title, I + ' * ' + bar + ' */'];
}
function aligned(pairs) {
  const w = Math.max(...pairs.map(p => p[0].length));
  return pairs.map(p => I + p[0].padEnd(w + 2) + '// ' + p[1]);
}

function buildRefactored(history) {
  const s = state.stage;
  const lv = state.lv;
  const cls = STAGES[s].file.replace('.java', '');
  const out = [];

  out.push('/**', ' * 파일명   : ' + STAGES[s].file, ' * 설명     : ' + STAGES[s].name + ' 단계 메인 클래스', ' * 작성자   : 개발자', ' * 작성일   : ' + today(), ' *', ' * 수정이력');
  history.slice(-5).forEach(h => out.push(' *   ' + h));
  out.push(' */', 'package com.mgl.codeidle;', '');

  const imps = new Set();
  for (let i = 1; i <= s; i++) STAGES[i].imports.forEach(x => imps.add(x));
  if (lv.log > 0) { imps.add('org.slf4j.Logger'); imps.add('org.slf4j.LoggerFactory'); }
  [...imps].sort().forEach(x => out.push('import ' + x + ';'));
  if (imps.size) out.push('');

  for (let i = 1; i <= s; i++) STAGES[i].annotations.forEach(a => out.push(a));
  out.push('public class ' + cls + ' {', '');

  const consts = [];
  if (lv.log > 0) consts.push(['private static final Logger log = LoggerFactory.getLogger(' + cls + '.class);', '로거']);
  if (lv.srv > 0) consts.push(['private static final int SERVER_WORKERS = ' + Math.pow(2, lv.srv) + ';', '서버 ' + lv.srv + '대']);
  if (s >= 6) consts.push(['private static final String AI_MODEL = "frontier-latest";', 'AI 모델']);
  if (consts.length) out.push(...sectionHeader('상수'), ...aligned(consts), '');

  const vars = [];
  for (let i = 0; i < VARS.length; i++) {
    const k = countOf(lv.var, i, VARS.length);
    if (!k) continue;
    const [t, n, v, desc] = VARS[i];
    if (k === 1) vars.push(['private ' + t + ' ' + n + ' = ' + v + ';', desc]);
    else vars.push(['private ' + t + '[] ' + n + 's = new ' + t + '[' + k + '];', desc + ' (' + k + '개 통합)']);
  }
  if (vars.length) out.push(...sectionHeader('멤버 변수'), ...aligned(vars), '');

  const methods = [];
  if (lv.srv > 0) methods.push('/** 서버 초기화 */', 'public void init() {', I + 'server.scale(SERVER_WORKERS);', '}', '');
  const funcKinds = Math.min(lv.func, NOUNS.length);
  const voKinds = Math.min(lv.cls, NOUNS.length);
  const voName = voKinds >= MERGE_MIN ? 'BaseVo' : 'Object';
  if (funcKinds >= MERGE_MIN) {
    methods.push('/** 공통 조회 (getUser, getOrder 외 ' + (lv.func - 2) + '개 메서드 통합) */');
    if (s >= 4) methods.push('@GetMapping("/{type}/{idx}")', 'public ' + voName + ' find(@PathVariable String type, @PathVariable int idx) {', I + 'return commonService.find(type, idx);', '}', '');
    else methods.push('public ' + voName + ' find(String type, int idx) {', I + 'return ' + (s >= 3 ? 'commonDao.select(type, idx)' : 'db.find(type, idx)') + ';', '}', '');
  } else {
    for (let i = 0; i < NOUNS.length; i++) {
      const k = countOf(lv.func, i, NOUNS.length);
      if (!k) continue;
      const N = NOUNS[i];
      const low = lower(N);
      const multi = k > 1;
      methods.push('/** ' + KO[N] + ' 조회' + (multi ? ' (get' + N + ' 외 ' + (k - 1) + '개 통합)' : '') + ' */');
      if (s >= 4) methods.push('@GetMapping("/' + low + '")');
      const arg = multi ? 'idx' : '';
      let body;
      if (s >= 4) body = 'return ' + low + 'Service.find(' + arg + ');';
      else if (s >= 3) body = 'return ' + low + 'Dao.select(' + arg + ');';
      else body = 'return db.find("' + low + '"' + (multi ? ', idx' : '') + ');';
      methods.push('public ' + (s >= 2 ? N + 'Vo' : 'Object') + ' get' + N + '(' + (multi ? 'int idx' : '') + ') {', I + body, '}', '');
    }
  }
  if (lv.test > 0) methods.push('// 단위 테스트 ' + lv.test + '건은 ' + cls + 'Test.java로 분리', '');
  if (methods.length) out.push(...sectionHeader('메서드'), ...methods.map(m => m ? I + m : ''));

  const vos = [];
  if (voKinds >= MERGE_MIN) {
    vos.push('/** 공통 VO (UserVo, OrderVo 외 ' + (lv.cls - 2) + '개 통합) */');
    if (s >= 2) vos.push('@Getter');
    vos.push('public static class BaseVo {', I + 'private String type;', I + 'private Long id;', I + 'private String name;', '}', '');
  } else {
    for (let i = 0; i < NOUNS.length; i++) {
      const k = countOf(lv.cls, i, NOUNS.length);
      if (!k) continue;
      const N = NOUNS[i];
      vos.push('/** ' + KO[N] + ' VO' + (k > 1 ? ' (' + N + 'Vo 외 ' + (k - 1) + '개 통합)' : '') + ' */');
      if (s >= 2) vos.push('@Getter');
      vos.push('public static class ' + N + 'Vo {', I + 'private Long id;', I + 'private String name;', '}', '');
    }
  }
  if (vos.length) out.push(...sectionHeader('VO'), ...vos.map(m => m ? I + m : ''));

  if (s >= 6) out.push(I + '// 이제 코드가 코드를 키운다', I + 'private final Agent dev = new Agent(AI_MODEL);', '');
  out.push(...sectionHeader('신규 개발 영역'));
  return out;
}

function totalLines() { return state.lineOffset + state.lines.length + 1; }
function refactorPreview() {
  const before = totalLines() + state.pending.split('\n').length - 1;
  const draft = state.history.concat(['v' + state.version + '.0 #' + (state.refactorCount + 1) + ' 미리보기']);
  return { before, after: buildRefactored(draft).length };
}

function doRefactor(reason) {
  const { before, after } = refactorPreview();
  const summary = after < before ? before + '줄을 ' + after + '줄로 정리' : '구역별 구조 정리';
  state.history.push('v' + state.version + '.0 #' + (state.refactorCount + 1) + ' ' + reason + ', ' + summary);
  state.refactorCount++;
  state.lines = buildRefactored(state.history);
  state.cur = '';
  state.curSrc = '';
  state.pending = '';
  state.filler = '';
  state.lineOffset = 0;
  state.debt = 0;
  state.bugs = [];
  state.bugInfo = {};
  state.refactoring = null;
  state.cleanUntil = state.time + 30;
  S().refactors++;
  renderAllCode();
  $('code').scrollTop = 0;
  toast('리팩토링 완료: ' + (after < before ? before.toLocaleString() + '줄을 ' + after.toLocaleString() + '줄로 정리' : '구역별 구조 정리') + ', 코드 복잡도와 버그 0');
}

function startRefactor(reason, manual) {
  if (state.refactoring) return;
  if (manual) {
    const p = refactorPreview();
    if (p.after >= p.before && state.debt < 5 && state.bugs.length === 0) { toast('이미 충분히 깔끔합니다'); return; }
  }
  const dur = refactorDuration();
  state.refactoring = { until: state.time + dur, dur, reason };
  toast('리팩토링 시작 (' + dur.toFixed(1) + '초 동안 개발 중단, 수입 절반)');
}

function checkStage() {
  const s = currentStage();
  if (s <= state.stage) return;
  state.stage = s;
  doRefactor(STAGES[s].name + ' 전환');
}

/* =========================================================
 * 에디터
 * ========================================================= */
function highlight(src) {
  const esc = src.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  if (/^\s*(\/\*|\*)/.test(src)) return '<span class="cm">' + esc + '</span>';
  const re = /(\/\/.*$)|("[^"\n]*"?)|(@\w+)|\b(public|private|protected|class|static|void|int|long|boolean|return|new|import|package|final|this|null|true|false|if|for|while|try|catch|throw)\b|\b(\d+L?)\b|\b([a-zA-Z_]\w*)(?=\()|\b([A-Z]\w*)\b/gm;
  return esc.replace(re, (m, cm, str, dec, kw, num, fn, type) => {
    if (cm) return '<span class="cm">' + cm + '</span>';
    if (str) return '<span class="str">' + str + '</span>';
    if (dec) return '<span class="dec">' + dec + '</span>';
    if (kw) return '<span class="kw">' + kw + '</span>';
    if (num) return '<span class="num">' + num + '</span>';
    if (fn) return '<span class="fn">' + fn + '</span>';
    if (type) return '<span class="type">' + type + '</span>';
    return m;
  });
}

function escHtml(s) { return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function lineHtml(no, text, cursor) {
  const info = state.bugs.includes(no) ? state.bugInfo[no] : null;
  let body;
  if (info) body = highlight(text.slice(0, info.pos)) + '<span class="typo">' + escHtml(text.substr(info.pos, info.len)) + '</span>' + highlight(text.slice(info.pos + info.len));
  else body = highlight(text);
  return '<div class="ln' + (info ? ' bug' : '') + '" data-no="' + no + '"><span class="no">' + no + '</span><span class="tx">' + body + (cursor ? '<span class="cursor"></span>' : '') + '</span></div>';
}

function renderAllCode() {
  const box = $('code');
  let html = '';
  for (let i = 0; i < state.lines.length; i++) html += lineHtml(state.lineOffset + i + 1, state.lines[i], false);
  html += lineHtml(totalLines(), state.cur, true);
  box.innerHTML = html;
  curEl = box.lastElementChild;
}

function updateCurLine() { curEl.querySelector('.tx').innerHTML = highlight(state.cur) + '<span class="cursor"></span>'; }

function commitLine() {
  const box = $('code');
  state.lines.push(state.cur);
  curEl.querySelector('.tx').innerHTML = highlight(state.cur);
  state.cur = '';
  S().linesTyped++;
  addDebt(0.4 * debtFactor());
  const tmp = document.createElement('div');
  tmp.innerHTML = lineHtml(totalLines(), '', true);
  curEl = tmp.firstChild;
  box.appendChild(curEl);
  if (state.lines.length > LINE_CAP) {
    state.lines.splice(0, LINE_TRIM);
    state.lineOffset += LINE_TRIM;
    for (let i = 0; i < LINE_TRIM; i++) box.removeChild(box.firstChild);
    state.bugs = state.bugs.filter(n => n > state.lineOffset);
    for (const k in state.bugInfo) if (+k <= state.lineOffset) delete state.bugInfo[k];
  }
}

// src: 'pending'(구매 코드, 자동 타이핑) 또는 'filler'(연습 코드, 키 입력으로만 타이핑)
function typeFrom(src, n, follow) {
  const box = $('code');
  const atBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 40;
  const q = state[src];
  let taken = 0;
  const skipIndent = () => {
    while (taken < q.length && q[taken] === ' ' && state.cur.trim() === '') { state.cur += ' '; taken++; state.curSrc = src; }
  };
  skipIndent();
  let typed = 0;
  while (typed < n && taken < q.length) {
    const ch = q[taken++];
    typed++;
    if (ch === '\n') { commitLine(); state.curSrc = ''; }
    else { state.cur += ch; state.curSrc = src; }
    skipIndent();
  }
  state[src] = q.slice(taken);
  updateCurLine();
  if (follow || atBottom) box.scrollTop = box.scrollHeight;
}

function finishFillerLine() {
  const idx = state.filler.indexOf('\n');
  state.cur += idx < 0 ? state.filler : state.filler.slice(0, idx);
  state.filler = idx < 0 ? '' : state.filler.slice(idx + 1);
  commitLine();
  state.curSrc = '';
  updateCurLine();
}

function nextFiller() {
  const snippet = FILLERS[state.fillerIdx % FILLERS.length];
  state.fillerIdx++;
  enqueue([''].concat(snippet), 'filler');
}

function typeOnce(follow) {
  let src;
  if (state.cur && state.curSrc) src = state.curSrc;
  else if (state.filler) src = 'filler';
  else if (state.pending) src = 'pending';
  else { nextFiller(); src = 'filler'; }
  typeFrom(src, ri(KEY_CHARS_MIN, KEY_CHARS_MAX), follow);
}

function hack() {
  S().keys++;
  lastKeyAt = performance.now();
  if (state.refactoring) { showFloat('리팩토링 중'); return; }
  const g = keyGain();
  addValue(g);
  typeOnce(true);
  showFloat('+' + fmt(g));
}

function juniorKey() {
  if (state.refactoring) return;
  addValue(keyGain());
  typeOnce(false);
}

function showFloat(text, good) {
  const now = performance.now();
  if (!good && now - lastFloatAt < 90) return;
  lastFloatAt = now;
  const el = document.createElement('div');
  el.className = 'float' + (good ? ' good' : '');
  el.textContent = text;
  $('editorPanel').appendChild(el);
  setTimeout(() => el.remove(), 700);
}

/* =========================================================
 * 버그, 장애
 * ========================================================= */
function bugEl(no) { return $('code').querySelector('.ln[data-no="' + no + '"]'); }

const TYPOS = [
  ['return', 'retrun'], ['public', 'pubilc'], ['private', 'privte'], ['String', 'Strnig'], ['static', 'statc'],
  ['void', 'viod'], ['new ', 'nwe '], ['class', 'calss'], ['import', 'improt'], ['null', 'nul'],
  ['List', 'Lsit'], ['Map', 'Mpa'], ['select', 'slect'], ['insert', 'isnert'], ['user', 'usr'], ['final', 'fianl'],
];
const STRAYS = ['/', ';', '.', ',', '\\', '`'];

// 정상 코드 한 줄을 오타나 잘못된 글자가 섞인 줄로 바꿈. pos, len은 틀린 부분 위치
function corrupt(text) {
  const start = text.length - text.trimStart().length;
  const opts = [];
  for (const [ok, bad] of TYPOS) {
    const i = text.indexOf(ok, start);
    if (i >= 0) opts.push({ text: text.slice(0, i) + bad + text.slice(i + ok.length), pos: i, len: bad.length });
  }
  const semi = text.lastIndexOf(';');
  if (semi >= 0) opts.push({ text: text.slice(0, semi) + ':' + text.slice(semi + 1), pos: semi, len: 1 });
  const eq = text.indexOf('==');
  if (eq >= 0) opts.push({ text: text.slice(0, eq) + '=' + text.slice(eq + 2), pos: eq, len: 1 });
  const paren = text.lastIndexOf(')');
  if (paren >= 0) opts.push({ text: text.slice(0, paren) + ']' + text.slice(paren + 1), pos: paren, len: 1 });
  if (!opts.length || Math.random() < 0.25) {
    const p = start + Math.floor(Math.random() * (text.length - start + 1));
    const ch = pick(STRAYS);
    opts.push({ text: text.slice(0, p) + ch + text.slice(p), pos: p, len: 1 });
  }
  return pick(opts);
}

function isCodeLine(t) {
  const s = t.trim();
  return s && !s.startsWith('//') && !s.startsWith('/*') && !s.startsWith('*');
}

function setLineDom(no) {
  const el = bugEl(no);
  if (!el) return;
  const fresh = document.createElement('div');
  fresh.innerHTML = lineHtml(no, state.lines[no - state.lineOffset - 1], false);
  el.replaceWith(fresh.firstChild);
}

function spawnBug() {
  const n = state.lines.length;
  const collect = (from, test) => {
    const out = [];
    for (let i = from; i < n; i++) {
      const no = state.lineOffset + i + 1;
      if (!state.bugs.includes(no) && test(state.lines[i])) out.push(no);
    }
    return out;
  };
  let cands = collect(Math.max(0, n - 30), isCodeLine);
  if (!cands.length) cands = collect(0, isCodeLine);
  if (!cands.length) cands = collect(0, t => t.trim());
  if (!cands.length) return false;
  const no = pick(cands);
  const idx = no - state.lineOffset - 1;
  const orig = state.lines[idx];
  const c = corrupt(orig);
  state.lines[idx] = c.text;
  state.bugInfo[no] = { orig, pos: c.pos, len: c.len };
  state.bugs.push(no);
  setLineDom(no);
  return true;
}

function queueBugs(n) {
  for (let i = 0; i < n; i++) if (!spawnBug()) state.bugQueue++;
}

function fixBug(no) {
  const info = state.bugInfo[no];
  const idx = no - state.lineOffset - 1;
  if (info && idx >= 0 && idx < state.lines.length) state.lines[idx] = info.orig;
  delete state.bugInfo[no];
  state.bugs = state.bugs.filter(b => b !== no);
  setLineDom(no);
  S().bugsFixed++;
  showFloat('버그 수정!', true);
}

function findBug() {
  if (!state.bugs.length) return;
  const el = bugEl(state.bugs[0]);
  if (el) el.scrollIntoView({ block: 'center' });
}

function startIncident() {
  queueBugs(3);
  state.incident = { until: state.time + incidentTime() };
  findBug();
}

function checkIncident() {
  if (!state.incident) return;
  if (state.bugs.length === 0 && state.bugQueue === 0) {
    const g = rate() * 30;
    addValue(g);
    addRep(2);
    S().incidentsOk++;
    state.incident = null;
    toast('장애 대응 성공! +' + fmt(g) + ', 평판 +2');
  } else if (state.time > state.incident.until) {
    addRep(-3);
    state.incident = null;
    toast('장애 대응 실패. 평판 -3');
  }
}

/* =========================================================
 * 의뢰
 * ========================================================= */
function genQuest() {
  const all = state.quests.active.concat(state.quests.offers);
  const avail = KINDS.filter(k => state.rep >= k.rep && !(k.unique && all.some(q => q.kind === k.id)));
  let total = avail.reduce((a, k) => a + k.w, 0);
  let roll = Math.random() * total;
  let k = avail[0];
  for (const x of avail) { roll -= x.w; if (roll <= 0) { k = x; break; } }
  const req = k.gen(Math.max(rate(), 1));
  if (req.earn) req.earn = Math.ceil(req.earn);
  return { id: ++state.quests.seq, kind: k.id, client: pick(CLIENTS), title: pick(k.titles), req, time: k.time, rewardSec: k.rewardSec, repGain: k.repGain };
}
function kindOf(q) { return KINDS.find(k => k.id === q.kind); }
function reqProgress(q, key) { return Math.max(0, S()[REQ_STAT[key]] - q.snap[key]); }
function questRatio(q) {
  const keys = Object.keys(q.req);
  return keys.reduce((a, k) => a + Math.min(1, reqProgress(q, k) / q.req[k]), 0) / keys.length;
}
function questReward(q, rush) { return rate() * q.rewardSec * questRewardMult() * (rush ? 0.6 : 1); }

function acceptQuest(id) {
  const Q = state.quests;
  if (Q.active.length >= questSlots()) { toast('진행 중인 의뢰가 가득 찼습니다'); return; }
  const idx = Q.offers.findIndex(q => q.id === id);
  if (idx < 0) return;
  const q = Q.offers.splice(idx, 1)[0];
  q.snap = {};
  for (const k in REQ_STAT) q.snap[k] = S()[REQ_STAT[k]];
  q.endsAt = state.time + q.time;
  Q.active.push(q);
  const spawn = kindOf(q).spawn;
  if (spawn) { queueBugs(spawn); findBug(); }
  if (Q.nextOfferAt < state.time + 5) Q.nextOfferAt = state.time + 5;
}

function completeQuest(q, rush) {
  const g = questReward(q, rush);
  addValue(g);
  const rg = rush ? Math.ceil(q.repGain / 2) : q.repGain;
  addRep(rg);
  if (rush) addDebt(25);
  S().questsDone++;
  if (q.kind === 'next') S().nextGenDone++;
  state.quests.active = state.quests.active.filter(x => x !== q);
  toast((rush ? '급하게 납품: ' : '납품 완료: ') + q.client + ' "' + q.title + '" +' + fmt(g) + ', 평판 +' + rg + (rush ? ', 코드 복잡도 +25%' : ''));
}

function rushQuest(id) {
  const q = state.quests.active.find(x => x.id === id);
  if (q && questRatio(q) >= 0.5) completeQuest(q, true);
}

function tickQuests() {
  const Q = state.quests;
  for (const q of Q.active.slice()) {
    if (questRatio(q) >= 1) completeQuest(q, false);
    else if (state.time > q.endsAt) {
      const loss = Math.ceil(q.repGain / 2);
      addRep(-loss);
      S().questsFailed++;
      Q.active = Q.active.filter(x => x !== q);
      toast('마감 초과: ' + q.client + ' "' + q.title + '" 평판 -' + loss);
    }
  }
  if (Q.offers.length < OFFER_SLOTS && state.time >= Q.nextOfferAt) {
    Q.offers.push(genQuest());
    Q.nextOfferAt = state.time + (Q.offers.length < 2 ? 3 : 15);
  }
  if (state.team.pm > 0 && Q.offers.length && Q.active.length < questSlots()) acceptQuest(Q.offers[0].id);
}

/* =========================================================
 * 팀, 커리어, 스킬

function hireCost(r) { return r.base * Math.pow(r.growth, state.team[r.id]); }
function hire(id) {
  const r = ROLES.find(x => x.id === id);
  if (!r || state.rep < r.rep || state.team[id] >= r.max) return;
  const c = hireCost(r);
  if (state.value < c) return;
  state.value -= c;
  state.team[id]++;
  toast(r.name + ' 합류! (월급: 수입의 ' + Math.round(r.salary * Math.pow(0.7, SK().lead) * 100) + '%)');
}

function canRelease() { return releaseGain() > state.releaseMult; }
function release() {
  if (!canRelease()) return;
  const g = releaseGain();
  const v = state.version;
  Object.assign(state, freshRun(v + 1));
  state.version = v + 1;
  state.releaseMult = g;
  state.quests.active = [];
  state.quests.offers = [];
  state.quests.nextOfferAt = state.time + 3;
  S().releases++;
  renderAllCode();
  save();
  toast('v' + v + '.0 릴리즈 완료! 배수 x' + fmt(g) + '. 진행 중이던 의뢰는 유지보수팀에 인계됐습니다');
}

function jobCond() { return { ver: state.version >= 4, rep: state.rep >= 20, lvl: state.career.level < 5 && !state.career.founded }; }
function canJobChange() { const c = jobCond(); return c.ver && c.rep && c.lvl; }
function jobGain() { return 1 + Math.floor(Math.log10(Math.max(1, state.releaseMult))) + Math.floor(state.rep / 25); }
function jobChange() {
  if (!canJobChange()) return;
  const gain = jobGain();
  const c = state.career;
  c.points += gain;
  c.level++;
  c.stats.jobs++;
  resetCompany();
  openModal({ title: TITLES[c.level] + '(으)로 이직 성공!', desc: '경력 포인트 +' + gain + '을 얻었습니다. 커리어 탭에서 스킬을 배우세요.<br>새 회사에서 v1.0부터 다시 시작합니다. 직급 보너스로 수입 x' + (1 + 0.5 * c.level).toFixed(1) + '가 적용됩니다.', choices: [{ label: '출근하기' }] });

function canFound() { return state.career.level >= 5 && !state.career.founded; }

function learnSkill(id) {

  if (c.founded) return st.nextGenDone === 0 ? '대표님, 평판 50을 모아 차세대 프로젝트를 수주하세요 (현재 ' + fmtInt(state.rep) + ')' : '대표님, 100양원을 향해 회사를 키우세요';
  if (state.rep < 5) return '평판 5 달성: 신규 구축 의뢰와 신입 개발자 고용 해금 (현재 ' + fmtInt(state.rep) + ')';
  if (st.releases === 0 && c.level === 0) return '가치 ' + fmt(RELEASE_MIN) + ' 달성 후 첫 릴리즈 (업그레이드 탭 아래)';
  if (state.rep < 20 && c.level === 0) return '평판 20 달성: 고도화 의뢰 해금, 이직 조건 (현재 ' + fmtInt(state.rep) + ')';
  if (!c.founded && c.level < 5) {
    const jc = jobCond();
    if (!jc.ver || !jc.rep) return (c.level === 0 ? '첫 이직 준비' : TITLES[c.level + 1] + '(으)로 이직 준비') + ': v4.0 도달' + (jc.ver ? ' 완료' : ' (현재 v' + state.version + '.0)') + ', 평판 20' + (jc.rep ? ' 완료' : ' (현재 ' + fmtInt(state.rep) + ')');
    return '커리어 탭에서 이직하세요 (' + TITLES[c.level] + '에서 ' + TITLES[c.level + 1] + '로)';
  }
  if (canFound()) return '최종 목표: 커리어 탭에서 창업하세요!';
  if (st.nextGenDone === 0) return '대표님, 평판 50을 모아 차세대 프로젝트를 수주하세요';
  return '대표님, 100양원을 향해 회사를 키우세요';
}

const TABS = [['upg', '업그레이드'], ['quest', '의뢰'], ['team', '팀'], ['career', '커리어'], ['ach', '업적']];

function renderTabs() {
  let html = '';
  for (const [id, name] of TABS) {
    let badge = '';
    if (id === 'quest' && state.quests.offers.length && state.quests.active.length < questSlots()) badge = '<span class="badge">' + state.quests.offers.length + '</span>';
    if (id === 'career' && (canJobChange() || canFound() || (state.career.points > 0 && SKILLS.some(s => state.career.skills[s.id] < s.max && state.career.points > state.career.skills[s.id])))) badge = '<span class="badge">!</span>';
    html += '<button data-tab="' + id + '" class="' + (tab === id ? 'on' : '') + '">' + name + badge + '</button>';

function sideUpg() {

  for (const u of UPGRADES) {
    const locked = state.runBest < u.unlock;

    h += '<div class="upg ' + cls + '" data-act="buy:' + u.id + '"><div><div class="upg-name">' + u.name + (locked ? '' : '<span class="upg-lv">Lv.' + state.lv[u.id] + '</span>') + '</div>' +

  }

function reqLine(q, key, active) {
  const target = q.req[key];
  const label = REQ_LABEL[key];
  if (!active) return '<div class="req">' + label + ' ' + (key === 'earn' ? fmt(target) : target + REQ_UNIT[key]) + '</div>';
  const p = Math.min(target, reqProgress(q, key));
  const done = p >= target;
  const txt = key === 'earn' ? fmt(p) + ' / ' + fmt(target) : Math.floor(p) + ' / ' + target + REQ_UNIT[key];
  return '<div class="req' + (done ? ' done' : '') + '">' + (done ? '[완료] ' : '') + label + ' ' + txt + '</div>';
}

/* =========================================================
 * 저장
 * ========================================================= */
function save() {
  state.lastSave = Date.now();
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (e) {}
}
function mergeInto(def, src) {
  for (const k in def) {
    if (!(k in src)) continue;
    const d = def[k];
    const v = src[k];
    if (d && typeof d === 'object' && !Array.isArray(d) && v && typeof v === 'object' && !Array.isArray(v)) mergeInto(d, v);
    else def[k] = v;
  }
  return def;
}
// 숫자가 깨진 값(NaN, null 등)을 안전한 값으로 되돌림
function sanitize() {
  const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
  const def = freshRun(1).lv;
  for (const k in def) state.lv[k] = Math.max(0, Math.floor(num(state.lv[k], 0)));
  state.value = Math.max(0, num(state.value, 0));
  state.runBest = Math.max(state.value, num(state.runBest, 0));
  state.releaseMult = Math.max(1, num(state.releaseMult, 1));
  state.debt = Math.min(100, Math.max(0, num(state.debt, 0)));
  state.rep = Math.max(0, num(state.rep, 0));
  state.time = num(state.time, 0);
  for (const k in state.team) state.team[k] = Math.max(0, Math.floor(num(state.team[k], 0)));
}

function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    state = mergeInto(defaultState(), s);
    state.bugs = state.bugs.filter(n => state.bugInfo[n]);
    sanitize();
    if (!Array.isArray(s.lines)) {
      const oldJava = Array.isArray(s.code) && !s.code.some(l => l.startsWith('#') || l.startsWith('print('));
      state.lines = oldJava ? s.code.slice() : [];
      if (oldJava) state.pending = '';
    }
    const sec = Math.min((Date.now() - state.lastSave) / 1000, OFFLINE_CAP);
    if (sec > 10) {
      const gain = rate() * sec * offlineEff();
      addValue(gain);
      setTimeout(() => toast('자리 비운 동안 PR ' + Math.max(1, Math.floor(sec / 60)) + '개 머지됨 +' + fmt(gain) + ' (오프라인 효율 ' + Math.round(offlineEff() * 100) + '%)'), 300);
    }
  } catch (e) {}
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

 * 이벤트 바인딩
 * ========================================================= */
document.addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === ' ' || e.key === 'Tab' || e.key === 'Backspace') e.preventDefault();
  if (state.challenge && e.key.length === 1 && /[a-z]/i.test(e.key)) challengeKey(e.key.toLowerCase());
  hack();
});

$('code').addEventListener('click', e => {
  const ln = e.target.closest('.ln.bug');
  if (ln) fixBug(+ln.dataset.no);
  else hack();
});

$('tabs').addEventListener('pointerdown', e => {
  const b = e.target.closest('[data-tab]');
  if (!b) return;
  tab = b.dataset.tab;
  lastSideHtml = '';
  renderSide();
  $('side').scrollTop = 0;
});

function doAction(act) {
  const [a, arg] = act.split(':');
  if (a === 'buy') buy(arg);
  else if (a === 'mode') buyMax = !buyMax;
  else if (a === 'release') release();
  else if (a === 'accept') acceptQuest(+arg);
  else if (a === 'rush') rushQuest(+arg);
  else if (a === 'hire') hire(arg);
  else if (a === 'skill') learnSkill(arg);
  else if (a === 'job') jobChange();
  else if (a === 'found') found();
  else if (a === 'findbug') findBug();
  lastSideHtml = '';
  renderSide();
}
// 패널이 주기적으로 다시 그려져도 클릭이 씹히지 않도록 pointerdown으로 처리
$('side').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled || el.classList.contains('locked')) return;
  doAction(el.dataset.act);
});
$('status').addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-act]');
  if (el) doAction(el.dataset.act);
});

$('refactorBtn').addEventListener('click', e => { e.currentTarget.blur(); startRefactor('중복 제거', true); });
$('saveBtn').addEventListener('click', () => { save(); toast('저장 완료'); });

let resetArmed = false;
let resetTimer;
$('resetBtn').addEventListener('click', () => {
  const btn = $('resetBtn');
  if (!resetArmed) {
    resetArmed = true;
    btn.textContent = '한 번 더 누르면 전체 초기화';
    clearTimeout(resetTimer);
    resetTimer = setTimeout(() => { resetArmed = false; btn.textContent = '초기화'; }, 3000);
    return;
  }
  resetArmed = false;
  btn.textContent = '초기화';
  state = defaultState();
  renderAllCode();
  save();
  toast('초기화 완료');
});
window.addEventListener('beforeunload', save);

/* =========================================================
 * 게임 루프
 * ========================================================= */
function perSecond() {
  sanitize();
  if (state.lines.length > 5 && state.bugs.length < MAX_BUGS && !state.refactoring && Math.random() < bugChance()) {
    if (spawnBug()) showFloat('버그 발생!');
  }
  while (state.bugQueue > 0 && spawnBug()) state.bugQueue--;
  if (state.team.senior > 0 && state.debt >= 60 && !state.refactoring) startRefactor('시니어 자동 리팩토링', false);
  if (!modalSpec && state.time >= state.nextEventAt) {
    if (S().questsDone >= 1 || state.runBest >= 5e3) fireEvent();
    state.nextEventAt = state.time + 100 + Math.random() * 60;
  }
  if (!state.challenge && state.time >= state.nextChallengeAt) {
    if (S().keys >= 30) startChallenge();
    state.nextChallengeAt = state.time + 70 + Math.random() * 30;
  }
  for (const [id, , , check] of ACHS) {
    if (!state.career.ach[id] && check()) { state.career.ach[id] = true; toast('업적 달성: ' + ACHS.find(a => a[0] === id)[1] + ' (수입 +3%)'); }
  }
  state.buffs = state.buffs.filter(b => b.until > state.time);
}

let last = performance.now();
let sideAcc = 0;
function loop(now) {
  const dt = Math.min((now - last) / 1000, 1);
  last = now;
  state.time += dt;
  S().playTime += dt;

  addValue(rate() * dt);
  checkStage();
  if (state.refactoring && state.time >= state.refactoring.until) doRefactor(state.refactoring.reason);

  autoAcc += dt * AUTO_TYPE_SPEED;
  const n = Math.floor(autoAcc);
  autoAcc -= n;
  if (state.pending && !state.refactoring) {
    const idle = performance.now() - lastKeyAt > IDLE_MS;
    if (idle && state.curSrc === 'filler' && !state.team.junior) finishFillerLine();
    const canAuto = state.curSrc === 'pending' || (state.cur === '' && (!state.filler || idle));
    if (canAuto) {
      if (state.pending.length > PENDING_CAP) typeFrom('pending', state.pending.length - PENDING_CAP, false);
      if (n > 0) typeFrom('pending', n, false);
    }
  }
  if (state.team.junior > 0) {
    juniorAcc += dt * 2 * state.team.junior;
    let k = 0;
    while (juniorAcc >= 1 && k++ < 20) { juniorKey(); juniorAcc--; }
  }

  tickQuests();
  checkIncident();
  if (state.challenge && state.time > state.challenge.until) endChallenge();
  if (modalSpec && modalSpec.def !== undefined && state.time - modalSpec.openedAt > 20) closeModal(modalSpec.def);

  secAcc += dt;
  if (secAcc >= 1) { secAcc -= 1; perSecond(); }

  renderTop();
  renderChallenge();
  sideAcc += dt;
  if (sideAcc >= 0.1) { sideAcc = 0; renderSide(); renderStatus(); renderBuffs(); }
  requestAnimationFrame(loop);
}

load();
renderAllCode();
$('code').scrollTop = $('code').scrollHeight;
setInterval(save, 5000);
requestAnimationFrame(loop);
</script>
</body>
